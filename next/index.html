<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On Tap</title>
<meta name="theme-color" content="#0e0c0a">
<link rel="icon" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="On Tap">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* NOTE ON BROWSER SUPPORT
     This runs on Fire TV's Silk browser, which is an old Chromium. Deliberately avoided:
     `inset:` shorthand, `clamp()`, `aspect-ratio`, container queries, CSS nesting.
     Everything below is long-hand and safe. */

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0e0c0a;
    --line:rgba(226,197,140,.14);
    --line-strong:rgba(226,197,140,.30);
    --cream:#f6ecd8;
    --muted:#a3937a;
    --dim:#7d7060;
    --gold:#e3ad42;
    --serif:'Bitter',Georgia,'Times New Roman',serif;
    --sans:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    --cond:'Barlow Condensed','Barlow',Arial Narrow,Arial,sans-serif;
    --s:1;
    --pad:calc(3.4 * var(--u));
    /* --u  = one unit along the board's OWN vertical axis
       --uw = one unit along its horizontal axis
       Rotating swaps them, so every size below stays correct. */
    --u:1vh;
    --uw:1vw;
  }
  body.rot90,body.rot270{--u:1vw;--uw:1vh}

  /* ================= background presets =================
     All deliberately dark — the board is light text, so contrast comes first. */
  body.bg-charcoal{
    background:
      radial-gradient(130% 95% at 50% -28%, #2b231b 0%, rgba(43,35,27,0) 68%),
      radial-gradient(80% 60% at 100% 110%, #1d1813 0%, rgba(29,24,19,0) 70%),
      #0e0c0a;
  }
  body.bg-chalk{
    background:
      radial-gradient(90% 70% at 28% 18%, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 62%),
      radial-gradient(80% 65% at 78% 82%, rgba(255,255,255,.035) 0%, rgba(255,255,255,0) 66%),
      linear-gradient(180deg,#1a2420 0%,#131b18 100%),
      #131b18;
  }
  body.bg-oak{
    background:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,.20) 0px, rgba(0,0,0,.20) 3px,
        rgba(255,255,255,.020) 3px, rgba(255,255,255,.020) 7px,
        rgba(0,0,0,.11) 7px, rgba(0,0,0,.11) 13px,
        rgba(255,255,255,.010) 13px, rgba(255,255,255,.010) 22px),
      radial-gradient(120% 90% at 50% 0%, #452c1a 0%, rgba(69,44,26,0) 70%),
      linear-gradient(180deg,#33200f 0%,#20130a 62%,#170d06 100%),
      #20130a;
  }
  body.bg-slate{
    background:
      radial-gradient(120% 90% at 18% -5%, #2b3238 0%, rgba(43,50,56,0) 62%),
      radial-gradient(90% 70% at 95% 105%, #232a30 0%, rgba(35,42,48,0) 68%),
      linear-gradient(180deg,#191d21 0%,#0f1215 100%),
      #0f1215;
  }
  body.bg-copper{
    background:
      linear-gradient(135deg, rgba(227,173,66,.11) 0%, rgba(227,173,66,0) 42%),
      radial-gradient(115% 90% at 72% -12%, #3d2c18 0%, rgba(61,44,24,0) 66%),
      linear-gradient(180deg,#1b150d 0%,#100b06 100%),
      #100b06;
  }
  /* photo: a scrim keeps the text readable whatever they upload */
  body.bg-photo{background-color:#0e0c0a;background-size:cover;background-position:center;
                background-repeat:no-repeat;background-attachment:scroll}
  /* Over a photo the cards go near-solid, so a busy picture can't wreck contrast.
     The photo still shows through the gaps between cards. */
  body.bg-photo .tap{
    background:linear-gradient(180deg,rgba(12,10,8,.86),rgba(12,10,8,.78));
    border-color:rgba(226,197,140,.22);
  }
  /* Night dimming — a veil over everything, so the background dims with the
     content rather than staying bright behind it. Sits outside .screen so it
     works the same when the board is rotated. */
  #dimveil{
    position:fixed;left:0;top:0;right:0;bottom:0;
    background:#000;opacity:0;pointer-events:none;z-index:80;
    -webkit-transition:opacity 3s ease;transition:opacity 3s ease;
  }
  body.dimmed #dimveil{opacity:.58}

  html,body{height:100%}
  body{
    background:var(--bg);          /* replaced by a .bg-* preset at render time */
    color:var(--cream);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    height:100vh;height:100dvh;
    padding:var(--pad) calc(var(--pad) * 1.45);
    display:flex;flex-direction:column;
  }

  /* ---- rotation, for a TV/monitor mounted on its side ----
     The board is drawn at swapped dimensions, then turned to match the panel. */
  body.rot90 .screen,body.rot270 .screen{
    position:absolute;top:0;left:0;
    width:100vh;height:100vw;
    -webkit-transform-origin:0 0;transform-origin:0 0;
  }
  body.rot90 .screen{
    -webkit-transform:rotate(90deg) translate(0,-100%);
    transform:rotate(90deg) translate(0,-100%);
  }
  body.rot270 .screen{
    -webkit-transform:rotate(-90deg) translate(-100%,0);
    transform:rotate(-90deg) translate(-100%,0);
  }
  body.rot180 .screen{
    -webkit-transform:rotate(180deg);transform:rotate(180deg);
  }
  /* A portrait board is much narrower, so the header has to give ground:
     smaller type, and the name is allowed to wrap rather than truncate. */
  body.rot90 h1,body.rot270 h1{
    font-size:calc(3.5 * var(--u));white-space:normal;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  body.rot90 .tagline,body.rot270 .tagline{
    font-size:calc(1.65 * var(--u));letter-spacing:.18em;
  }
  body.rot90 .ontap,body.rot270 .ontap{
    font-size:calc(2.5 * var(--u));letter-spacing:.28em;text-indent:.28em;
  }
  body.rot90 .clock,body.rot270 .clock{font-size:calc(1.7 * var(--u))}
  body.rot90 .mark img,body.rot270 .mark img{height:calc(6.4 * var(--u))}
  body.rot90 .mark.sz-s img,body.rot270 .mark.sz-s img{height:calc(4.8 * var(--u))}
  body.rot90 .mark.sz-l img,body.rot270 .mark.sz-l img{height:calc(9 * var(--u))}
  body.rot90 #fshint,body.rot270 #fshint{
    font-size:calc(1.5 * var(--u));
    padding:calc(.95 * var(--u)) calc(1.6 * var(--u));
  }

  /* ================= header ================= */
  header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:calc(2.5 * var(--uw));padding-bottom:calc(1.9 * var(--u));position:relative;
  }
  header::after{  /* gold rule that fades out to the right */
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg,var(--gold) 0%,rgba(227,173,66,.35) 45%,rgba(227,173,66,.06) 100%);
  }
  .brand{display:flex;align-items:center;gap:calc(1.5 * var(--uw));min-width:0}
  /* centred banner logo across the top */
  body.banner header{display:block;text-align:center;position:relative}
  body.banner .brand{display:block}
  body.banner .mark{line-height:0}
  body.banner .mark img{height:auto;max-height:calc(13 * var(--u));max-width:82vw;margin:0 auto}
  body.banner .right{position:absolute;right:0;bottom:calc(2.2 * var(--u));text-align:right}
  body.banner .ontap{display:none}
  .mark{line-height:0;flex:0 0 auto;font-size:calc(6 * var(--u))}
  .mark img{display:block;max-width:calc(30 * var(--uw));object-fit:contain;height:calc(8.5 * var(--u))}
  .mark.sz-s img{height:calc(6 * var(--u))}
  .mark.sz-l img{height:calc(12.5 * var(--u))}
  .names{min-width:0}
  h1{
    font-family:var(--serif);font-weight:700;
    font-size:calc(5 * var(--u));line-height:1.02;letter-spacing:-.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tagline{
    font-family:var(--cond);font-weight:500;font-size:calc(2.1 * var(--u));
    color:var(--muted);letter-spacing:.3em;text-transform:uppercase;margin-top:calc(.7 * var(--u));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .right{text-align:right;flex:0 0 auto}
  .ontap{
    font-family:var(--cond);font-weight:600;font-size:calc(3.6 * var(--u));
    letter-spacing:.42em;text-indent:.42em;
    color:var(--gold);text-transform:uppercase;line-height:1;
  }
  .clock{
    font-family:var(--cond);font-weight:500;font-size:calc(2.1 * var(--u));color:var(--muted);
    margin-top:calc(.9 * var(--u));letter-spacing:.16em;
  }

  /* ================= grid ================= */
  /* Happy hour bar. Sits between the header and the beers and only exists while the
     window is open — the cards give up the space and fitToCards resizes to suit. */
  #happybar{
    flex:0 0 auto;display:none;margin-top:calc(1.6 * var(--u));
    text-align:center;background:var(--gold);color:#1a1408;
    font-family:var(--cond);font-weight:600;text-transform:uppercase;
    font-size:calc(3.1 * var(--u));letter-spacing:.28em;text-indent:.28em;
    padding:calc(.85 * var(--u)) 0;border-radius:calc(.8 * var(--u));
  }
  #happybar.on{display:block}

  main{flex:1 1 auto;min-height:0;position:relative;padding-top:calc(2.1 * var(--u))}
  .page{
    position:absolute;top:calc(2.1 * var(--u));right:0;bottom:0;left:0;
    display:grid;gap:calc(1.5 * var(--u)) calc(2 * var(--uw));
    opacity:0;transition:opacity .8s ease;pointer-events:none;
  }
  .page.on{opacity:1}

  /* ================= tap card ================= */
  .tap{
    position:relative;overflow:hidden;min-height:0;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
    border:1px solid var(--line);border-radius:calc(1.5 * var(--u));
    padding:calc((1.7 * var(--u)) * var(--s)) calc((2.1 * var(--u)) * var(--s));
    padding-left:calc((2.4 * var(--u)) * var(--s));
    display:flex;align-items:center;gap:calc((1.9 * var(--u)) * var(--s));
  }
  .tap::before{  /* colour spine, tinted per beer */
    content:"";position:absolute;top:0;bottom:0;left:0;width:calc(.55 * var(--u));
    background:var(--beer,#e3ad42);opacity:.85;
  }
  /* Kicked is genuinely gone, so it may fade into the background. A beer that is
     coming gets no dimming and no tint — it renders exactly like every other card,
     and the page heading is what marks it out. */
  .tap.out{opacity:.4}
  .tap.out::before{opacity:.3}

  /* Heading for a page holding nothing but upcoming beers. A solid gold bar, so it
     carries the length of the room. text-indent cancels the trailing letter-space,
     which would otherwise sit the text slightly left of true centre. */
  .pagehead{
    grid-column:1/-1;align-self:end;text-align:center;
    background:var(--gold);color:#1a1408;
    font-family:var(--cond);font-weight:600;text-transform:uppercase;
    font-size:calc(3.9 * var(--u));
    letter-spacing:.3em;text-indent:.3em;
    padding:calc(1 * var(--u)) 0;
    border-radius:calc(.8 * var(--u));
  }

  /* tap number */
  .numbadge{
    flex:0 0 auto;
    width:calc((5.6 * var(--u)) * var(--s));height:calc((5.6 * var(--u)) * var(--s));
    border:1px solid var(--line-strong);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--cond);font-weight:600;
    font-size:calc((3.2 * var(--u)) * var(--s));color:var(--gold);
    letter-spacing:.02em;
  }

  /* glass */
  .glasssvg{width:100%;height:100%;display:block;color:var(--cream);opacity:.93}
  .glass.shaped{
    background:none;border:none;border-radius:0;overflow:visible;max-height:100%;
    width:calc((6.4 * var(--u)) * var(--s));height:calc((13.5 * var(--u)) * var(--s));
  }
  .glass{
    flex:0 0 auto;
    width:calc((4.8 * var(--u)) * var(--s));height:calc((13 * var(--u)) * var(--s));max-height:100%;
    border:1px solid var(--line);border-radius:calc(.5 * var(--u)) calc(.5 * var(--u)) calc(.9 * var(--u)) calc(.9 * var(--u));
    background:rgba(255,255,255,.055);
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:flex-end;
  }
  .foam{flex:0 0 auto;height:calc(.85 * var(--u));width:100%;
        background:linear-gradient(180deg,#fffdf7,#eee0c6)}
  .fill{width:100%;transition:height .7s ease;
        box-shadow:inset 0 calc(.5 * var(--u)) calc(1.3 * var(--u)) rgba(255,255,255,.22)}

  /* text block */
  .body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;
        gap:calc(.45 * var(--u))}
  .namerow{display:flex;align-items:center;gap:calc((1.15 * var(--u)) * var(--s));min-width:0}
  .ico{flex:0 0 auto;color:var(--gold);
       width:calc((3.9 * var(--u)) * var(--s));height:calc((3.9 * var(--u)) * var(--s))}
  .guest{
    flex:0 0 auto;
    font-family:var(--cond);font-weight:600;
    font-size:calc(1.5 * var(--u) * var(--s));
    letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    border:1px solid rgba(226,197,140,.28);
    border-radius:calc(.45 * var(--u));
    padding:calc(.3 * var(--u)) calc(.85 * var(--u));
    white-space:nowrap;
  }
  .name{
    flex:1 1 auto;min-width:0;
    font-family:var(--serif);font-weight:700;
    font-size:calc((3.4 * var(--u)) * var(--s));line-height:1.08;letter-spacing:-.004em;
    /* A long name wraps to a second line instead of being cut off — the card has
       the height for it, and half a beer name is no use from across the room.
       -webkit-line-clamp is already relied on for the rotated heading, so it is
       safe on Fire TV's Silk. */
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    white-space:normal;overflow:hidden;
  }
  .style{
    font-family:var(--cond);font-weight:600;
    font-size:calc((2.15 * var(--u)) * var(--s));color:var(--gold);
    letter-spacing:.19em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .notes{
    font-family:var(--sans);font-weight:400;
    font-size:calc((2.05 * var(--u)) * var(--s));color:var(--muted);line-height:1.36;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  /* Prices (business mode). The amount is the loud part and the pour name is a
     quiet label beside it, so the row scans as money first from across the room.
     Wraps rather than shrinks, because an unreadable price is worse than two lines. */
  /* A priced card wraps, letting the price row take a full-width line of its own
     below the beer and its stats. Notes give way to one line to pay for it. */
  /* Prices occupy the tasting note's line, so a priced card has exactly the same
     shape as an ordinary one — same glass, same rows, same beers per screen. */
  .tap.priced .notes{display:none}
  .prices{
    display:flex;flex-wrap:wrap;align-items:baseline;
    gap:calc((.25 * var(--u)) * var(--s)) calc((1.9 * var(--u)) * var(--s));
  }
  .price{display:flex;align-items:baseline;gap:calc((.62 * var(--u)) * var(--s))}
  .price b{
    font-family:var(--sans);font-weight:700;color:var(--gold);
    font-size:calc((2.45 * var(--u)) * var(--s));line-height:1.2;
    font-variant-numeric:tabular-nums;
  }
  /* A discounted pour shows the new price with the old one struck through beside it. */
  .price.happy b{color:#f3c969}
  .price s{
    font-family:var(--sans);font-weight:600;color:var(--dim);
    font-size:calc((1.7 * var(--u)) * var(--s));
    text-decoration:line-through;margin-left:calc((.35 * var(--u)) * var(--s));
  }
  .price i{
    font-family:var(--cond);font-style:normal;font-weight:600;color:var(--muted);
    font-size:calc((1.42 * var(--u)) * var(--s));
    letter-spacing:.16em;text-transform:uppercase;
  }

  /* stats */
  .stats{flex:0 0 auto;display:flex;align-items:center;gap:calc((1.9 * var(--u)) * var(--s))}
  .stat{text-align:center}
  .stat .v{
    font-family:var(--sans);font-weight:600;
    font-size:calc((3.2 * var(--u)) * var(--s));line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .stat .k{
    font-family:var(--cond);font-weight:500;
    font-size:calc((1.45 * var(--u)) * var(--s));color:var(--dim);
    letter-spacing:.24em;text-transform:uppercase;margin-top:calc(.5 * var(--u));
  }
  .badge{
    font-family:var(--cond);font-weight:600;
    font-size:calc((1.5 * var(--u)) * var(--s));letter-spacing:.19em;text-transform:uppercase;
    padding:calc(.6 * var(--u)) calc(1.1 * var(--u));border-radius:calc(.5 * var(--u));border:1px solid currentColor;white-space:nowrap;
  }
  .badge.low{color:#eb9a3c}
  .badge.kicked{color:#8b8172}
  .badge.coming{color:#79b39c}

  /* ================= footer ================= */
  footer{
    flex:0 0 auto;margin-top:calc(1.5 * var(--u));padding-top:calc(1.4 * var(--u));border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--cond);font-weight:500;
    font-size:calc(1.75 * var(--u));color:var(--dim);letter-spacing:.2em;text-transform:uppercase;
  }
  .dots{display:flex;gap:calc(1 * var(--u));align-items:center}
  .dot{width:calc(1 * var(--u));height:calc(1 * var(--u));border-radius:50%;background:rgba(246,236,216,.2);
       transition:background .5s ease}
  .dot.on{background:var(--gold)}

  .msg{
    position:absolute;top:0;right:0;bottom:0;left:0;
    display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:calc(3.2 * var(--u));color:var(--muted);padding:calc(6 * var(--u));line-height:1.55;
  }

  /* the immature bit */
  #rain{
    position:fixed;left:0;top:0;right:0;bottom:0;
    pointer-events:none;z-index:9000;overflow:hidden;display:none;
  }
  #rain.on{display:block}
  .drop{
    position:absolute;top:0;color:var(--cream);opacity:.9;
    animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards;
  }
  .drop svg{display:block;width:100%;height:auto}
  @keyframes fall{
    from{transform:translateY(-20vh) rotate(0deg)}
    to  {transform:translateY(115vh) rotate(var(--spin,360deg))}
  }

  #histgag{
    position:fixed;left:50%;top:50%;z-index:9600;display:none;
    -webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);
    width:76vw;max-width:1180px;background:#fff;border-radius:10px;overflow:hidden;
    box-shadow:0 3vh 9vh rgba(0,0,0,.8);
    color:#202124;font-family:-apple-system,Arial,sans-serif;
  }
  #histgag.on{display:block}
  #histgag .hbar{background:#dee1e6;padding:.9vh 1.4vh 0;display:flex;align-items:flex-end;gap:.7vh}
  #histgag .htab{background:#fff;border-radius:.9vh .9vh 0 0;padding:.9vh 1.8vh;font-size:1.4vh;
                 display:flex;gap:.9vh;align-items:center}
  #histgag .hdot{width:1.5vh;height:1.5vh;border-radius:.35vh;background:#4285f4;display:inline-block}
  #histgag .hurl{padding:1.1vh 1.8vh;display:flex;align-items:center;gap:1.2vh;border-bottom:1px solid #e8eaed;color:#5f6368;font-size:1.5vh}
  #histgag .hbox{flex:1;background:#f1f3f4;border-radius:1.8vh;padding:.8vh 1.6vh;color:#3c4043}
  #histgag h3{padding:1.6vh 3vh .4vh;font-size:2.4vh;font-weight:500}
  #histgag .hday{padding:0 3vh 1.4vh;color:#5f6368;font-size:1.4vh}
  #histgag .hrows{padding:0 3vh 2.2vh}
  #histgag .hrow{display:flex;align-items:center;gap:1.6vh;padding:1vh 0;border-bottom:1px solid #f1f3f4;font-size:1.65vh}
  #histgag .htime{color:#5f6368;font-size:1.4vh;width:8vh;flex:0 0 auto}
  #histgag .hfav{width:1.8vh;height:1.8vh;border-radius:50%;background:#dadce0;flex:0 0 auto}
  #histgag .htitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #histgag .hsite{color:#5f6368;font-size:1.4vh}

  /* Explicit edges rather than inset: Fire OS webviews are old. */
  #stillgag{
    position:fixed;left:0;top:0;right:0;bottom:0;z-index:9700;display:none;
    background:rgba(0,0,0,.78);align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  #stillgag.on{display:flex}
  #stillgag .sbox{text-align:center;padding:0 4vh;max-width:78vw}
  #stillgag .stitle{color:#fff;font-size:5.2vh;font-weight:400;line-height:1.2;margin:0 0 1.6vh}
  #stillgag .ssub{color:#b3b3b3;font-size:2.4vh;margin:0 0 4.4vh;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stillgag .srow{display:flex;gap:1.6vh;justify-content:center}
  #stillgag .sbtn{
    font-size:2.2vh;padding:1.3vh 3.8vh;border-radius:.4vh;
    border:1px solid transparent;background:#fff;color:#000;font-weight:500;
  }

  /* Unmistakably not the live board. Sits inside .screen so it rotates with it. */

    background:#b4462e;color:#fff;

  #fshint{

</style>

<video id="awake" muted loop playsinline webkit-playsinline preload="auto"
       aria-hidden="true" tabindex="-1"
       style="position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01;
              pointer-events:none;z-index:-1">

  <source src="keepawake.webm" type="video/webm">

<script src="icons.js?v=1785156305"></script>
<script>
(function(){
  "use strict";

  /* Never let the TV go blank, even if taps.json is unreachable. */
  var FALLBACK = {
    brewery:"Home Brew", tagline:"", showClock:true, perPage:"auto", rotateSeconds:20,
    hideKicked:false, logo:"",
    taps:[{num:1,name:"Tap list unavailable",style:"Check back shortly",abv:"",ibu:"",
           notes:"The tap list could not be loaded.",color:"#e3ad42",icon:"",level:0,status:"pouring"}]
  };

  var el = function(id){ return document.getElementById(id); };
  var data = null, pages = [], pageIndex = 0, rotateTimer = null, lastStamp = "";

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function chunk(arr, n){
    var out = [], i;
    for(i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out.length ? out : [[]];
  }

  /* ---------- clock ---------- */
  function tickClock(){
    if(!data || data.showClock === false){ el("clock").textContent = ""; return; }
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "PM" : "AM";
    h = h % 12; if(h === 0) h = 12;
    el("clock").textContent = h + ":" + (m < 10 ? "0" + m : m) + " " + ap;
  }
  setInterval(tickClock, 15000);

  /* ---------- one card ---------- */
  /* Whole days from today until an ISO yyyy-mm-dd date. */
  function daysUntil(iso){
    if(!iso) return null;
    var parts = String(iso).split("-");
    if(parts.length !== 3) return null;
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    if(isNaN(d.getTime())) return null;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    d.setHours(0, 0, 0, 0);
    return Math.round((d.getTime() - today.getTime()) / 86400000);
  }

  /* ---------- business mode: pour sizes and prices ----------
     Sizes are whatever the venue calls them. Prices live on each beer, keyed by
     the size's id, so renaming "Middy" to "Pot" or reordering sizes never
     detaches a price from the pour it belongs to. */
  var DEFAULT_SIZES = [
    { id:"s1", name:"Middy",    ml:285 },
    { id:"s2", name:"Schooner", ml:425 },
    { id:"s3", name:"Pint",     ml:570 }
  ];
  function pricing(){
    var p = (data && data.pricing) || {};
    return {
      on: !!p.on,
      currency: p.currency || "$",
      sizes: (p.sizes && p.sizes.length) ? p.sizes : DEFAULT_SIZES,
      happy: p.happy || null
    };
  }

  /* ---------- happy hour ----------
     Minutes since midnight, so a window that runs past midnight (22:00-01:00) is
     just "start > end", rather than needing date arithmetic. */
  function hhmmToMin(v){
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(v || "").trim());
    if(!m) return null;
    var h = Number(m[1]), mi = Number(m[2]);
    if(h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }
  function happyActive(){
    var h = pricing().happy;
    if(!h || !h.on) return false;
    var from = hhmmToMin(h.from), to = hhmmToMin(h.to);
    if(from === null || to === null || from === to) return false;
    var now = new Date();
    /* An empty day list means every day. Days are 0=Sunday, as JS gives them. */
    if(h.days && h.days.length && h.days.indexOf(now.getDay()) === -1) return false;
    var mins = now.getHours() * 60 + now.getMinutes();
    return (from < to) ? (mins >= from && mins < to)
                       : (mins >= from || mins < to);   /* wraps past midnight */
  }
  function happyPrice(sizeId){
    var h = pricing().happy;
    if(!h || !h.prices) return null;
    var v = h.prices[sizeId];
    return (v == null || String(v).trim() === "") ? null : v;
  }
  function prettyTime(v){
    var mins = hhmmToMin(v);
    if(mins === null) return "";
    var h = Math.floor(mins / 60), m = mins % 60;
    var ap = h >= 12 ? "pm" : "am", h12 = (h % 12) || 12;
    return h12 + (m ? ":" + (m < 10 ? "0" + m : m) : "") + ap;
  }
  /* $13 rather than $13.00, but $7.50 keeps its cents — how a menu is written. */
  function money(cur, v){
    var n = Number(v);
    if(!isFinite(n)) return "";
    return cur + (n % 1 === 0 ? String(n) : n.toFixed(2));
  }
  function priceHTML(t){
    var pr = pricing();
    if(!pr.on) return "";
    var happy = happyActive();
    var cells = [], i, sz, v, hp;
    for(i = 0; i < pr.sizes.length; i++){
      sz = pr.sizes[i];
      v  = t.prices ? t.prices[sz.id] : null;
      /* A pour with no price for this beer is simply left off, so a keg sold only
         by the pint does not show two blank columns. */
      if(v == null || String(v).trim() === "") continue;
      /* Happy hour only discounts a pour the beer is actually sold in, so it can
         never invent a price for a size this keg is not poured in. */
      hp = happy ? happyPrice(sz.id) : null;
      if(hp != null && Number(hp) < Number(v)){
        cells.push('<span class="price happy"><b>' + esc(money(pr.currency, hp)) + '</b>' +
                   '<s>' + esc(money(pr.currency, v)) + '</s><i>' +
                   esc(sz.name || (sz.ml ? sz.ml + "ml" : "")) + '</i></span>');
      } else {
        cells.push('<span class="price"><b>' + esc(money(pr.currency, v)) + '</b><i>' +
                   esc(sz.name || (sz.ml ? sz.ml + "ml" : "")) + '</i></span>');
      }
    }
    return cells.length ? '<div class="prices">' + cells.join("") + '</div>' : "";
  }

  function comingText(t){
    var n = daysUntil(t.ready);
    if(n === null) return "Coming Soon";
    if(n > 1)   return "Ready in " + n + " days";
    if(n === 1) return "Ready tomorrow";
    if(n === 0) return "Ready today";
    return "Ready now";
  }

  function tapHTML(t){
    var level  = Math.max(0, Math.min(100, levelFor(t)));
    var status = t.status || "pouring";
    var kicked = status === "kicked" || (levelsTracked() && status === "pouring" && level <= 0);
    var coming = status === "coming";
    var color  = t.color || "#e3ad42";

    var badge = "";
    if(coming)           badge = '<div class="badge coming">' + esc(comingText(t)) + '</div>';
    else if(kicked)      badge = '<div class="badge kicked">Kicked</div>';
    else if(levelsTracked() && level <= 20) badge = '<div class="badge low">Almost Gone</div>';

    /* Blank means "not entered" - leave it off entirely.
       A zero IBU or SRM tells nobody anything either, so that goes too. A zero
       ABV is kept, because "0%" is a genuine claim about a drink. */
    function has(v){ return String(v == null ? "" : v).trim() !== ""; }
    function nonZero(v){
      if(!has(v)) return false;
      var num = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
      return isNaN(num) ? true : num !== 0;
    }

    /* Badge goes FIRST so the ABV/IBU/SRM columns stay hard right and line up
       across every card, the same way the GUEST chip sits ahead of them. */
    var stats = badge;
    if(has(t.abv))     stats += '<div class="stat"><div class="v">' + esc(String(t.abv).trim()) + '%</div><div class="k">ABV</div></div>';
    if(nonZero(t.ibu)) stats += '<div class="stat"><div class="v">' + esc(String(t.ibu).trim()) + '</div><div class="k">IBU</div></div>';
    if(nonZero(t.srm)) stats += '<div class="stat"><div class="v">' + esc(t.srm) + '</div><div class="k">SRM</div></div>';

    /* A beer that is coming pours FULL — it is a keg waiting to be tapped, and an
       empty glass under a Coming Soon banner reads as though it has already gone.
       Kicked stays empty, because that one really is finished. */
    var shown = kicked ? 0 : (coming ? 100 : level);

    /* The price row is a sibling of the text column, not a child of it, so it can
       wrap onto its own full-width line under the whole card. Inside .body it was
       trapped in the narrow text column and three pours spilled over two lines. */
    var priceRow = priceHTML(t);

    return '' +
      '<div class="tap' + (kicked ? " out" : "") + (priceRow ? " priced" : "") +
           '" style="--beer:' + esc(color) + '">' +
        '<div class="numbadge">' + esc(t.num != null ? t.num : "") + '</div>' +
        '<div class="glass shaped">' +
          (window.glassSVG ? window.glassSVG(window.glassFor ? window.glassFor(t) : t.icon, shown, color, (t.num != null ? t.num : "x")) : "") +
        '</div>' +
        '<div class="body">' +
          '<div class="namerow">' +
            (window.beerIconSVG ? window.beerIconSVG(t.icon, "ico") : "") +
            '<div class="name">' + esc(t.name || "Untitled") + '</div>' +
            (t.guest ? '<div class="guest">Guest</div>' : '') +
          '</div>' +
          (has(t.style) ? '<div class="style">' + esc(String(t.style).trim()) + '</div>' : '') +
          (has(t.notes) ? '<div class="notes">' + esc(String(t.notes).trim()) + '</div>' : '') +
          priceRow +
        '</div>' +
        '<div class="stats">' + stats + '</div>' +
      '</div>';
  }

  /* ---------- night dimming ---------- */
  function applyDim(){
    if(!data || !data.dimAtNight){ document.body.className = bodyClass; return; }
    var from = Number(data.dimFrom); if(isNaN(from)) from = 22;
    var to   = Number(data.dimTo);   if(isNaN(to))   to   = 7;
    var h = new Date().getHours();
    var night = (from === to) ? false
              : (from < to ? (h >= from && h < to) : (h >= from || h < to));
    document.body.className = bodyClass + (night ? " dimmed" : "");
  }
  var bodyClass = "";
  setInterval(applyDim, 60000);

  /* ---------- render ---------- */
  function render(){
    var main = el("main");

    /* screen rotation, for a panel mounted on its side */
    var rot = Number(data.rotate) || 0;
    if(rot !== 90 && rot !== 180 && rot !== 270) rot = 0;

    var bg = data.bg || "charcoal";
    if(!/^(charcoal|chalk|oak|slate|copper|photo)$/.test(bg)) bg = "charcoal";
    bodyClass = (rot ? "rot" + rot + " " : "") + "bg-" + bg + (data.logoBanner ? " banner" : "");
    document.body.className = bodyClass;
    applyDim();
    applyBgPhoto(bg);

    /* header logo */
    var mark = el("mark");
    var size = (data.logoSize === "s" || data.logoSize === "l") ? data.logoSize : "m";
    mark.className = "mark sz-" + size;
    if(data.logo){
      var img = new Image();
      img.alt = "";
      img.onerror = function(){ mark.className = "mark"; mark.textContent = "🍺"; };
      img.src = data.logo;
      mark.innerHTML = "";
      mark.appendChild(img);
    } else {
      mark.className = "mark";
      mark.textContent = "🍺";
    }

    var hideName = !!(data.logo && data.logoOnly);
    el("brewery").style.display = hideName ? "none" : "";
    el("brewery").textContent = data.brewery || "On Tap";
    el("tagline").textContent = data.tagline || "";
    tickClock();

    var taps = (data.taps || []).slice();

    /* A half-added beer with no name has nothing to show — and with pagination it
       would otherwise rotate in as a blank "Untitled" card. Skip it. */
    taps = taps.filter(function(t){ return String(t.name || "").trim() !== ""; });

    if(data.hideKicked){
      taps = taps.filter(function(t){
        return !(t.status === "kicked" || (levelsTracked() && t.status !== "coming" && levelFor(t) <= 0));
      });
    }

    if(!taps.length){
      main.innerHTML = '<div class="msg">Nothing on tap right now.<br>Check back soon 🍺</div>';
      el("dots").innerHTML = ""; el("foot-left").textContent = "";
      if(rotateTimer) clearInterval(rotateTimer);
      return;
    }

    /* "auto" fits everything on one screen up to 8, so it only paginates when it must. */
    var perPage = data.perPage;
    /* Business mode is the ordinary board with prices — same beers per screen. */
    var maxPer = 8;
    if(perPage === "auto" || perPage == null || !Number(perPage)){
      perPage = Math.min(maxPer, taps.length);
    }
    perPage = Math.max(1, Math.min(maxPer, Number(perPage)));

    pages = chunk(taps, perPage);

    /* A rotated (portrait) board is narrow — one column reads far better there. */
    var portrait = (rot === 90 || rot === 270);

    /* Card size is set ONCE, from the fullest page, and every page reuses it — a
       short last page must not grow its cards to fill the space, or the same beer
       changes size as the board rotates. */
    var cols  = (portrait || perPage <= 3) ? 1 : 2;
    var rows  = Math.ceil(perPage / cols);
    /* Fill the card height properly — 4 rows still needs to read from the sofa.
       This is only a starting point; fitToCards settles the final size. */
    var scale = Math.max(portrait ? 0.5 : 0.78, Math.min(1.3, 3.6 / rows));

    main.innerHTML = pages.map(function(p, i){
      /* A page of nothing but upcoming beers is a section, not a short tap list,
         so it gets a heading and reads left-to-right under it. */
      var allComing = p.length > 0 && p.every(function(t){ return t.status === "coming"; });
      var full      = p.length === perPage;
      /* Card height is pinned to what a FULL page produces, written as a share of
         the page rather than 1fr. That way a heading can sit above the cards while
         they keep exactly the height they have on page one, and the leftover space
         collects harmlessly at the bottom instead of inflating the cards. */
      var rowH = 'calc((100% - ' + ((rows - 1) * 1.5) + ' * var(--u)) / ' + rows + ')';
      return '<div class="page' + (i === 0 ? " on" : "") + '" style="' +
        'grid-template-columns:repeat(' + cols + ',1fr);' +
        'grid-template-rows:' + (allComing
          ? 'auto repeat(' + Math.ceil(p.length / cols) + ',' + rowH + ')'
          : 'repeat(' + rows + ',1fr)') + ';' +
        (allComing ? 'align-content:start;' : '') +
        /* Fill down the left column first, then the right — so the taps read
           1,2,3,4 down one side and 5,6,7,8 down the other. Single-column
           (portrait) layouts must stay row-flow or everything lands in one row.
           A part-full page also flows by row, so its cards spread across rather
           than stacking in column one and stranding half the screen. */
        'grid-auto-flow:' + (cols > 1 && full ? "column" : "row") + ';' +
        '--s:' + scale.toFixed(3) + '">' +
        (allComing ? '<div class="pagehead">Coming Soon</div>' : '') +
        p.map(tapHTML).join("") + '</div>';
    }).join("");

    el("dots").innerHTML = pages.length > 1
      ? pages.map(function(_, i){ return '<div class="dot' + (i === 0 ? " on" : "") + '"></div>'; }).join("")
      : "";

    var pouring = taps.filter(function(t){
      return t.status !== "coming" && !(t.status === "kicked" || (levelsTracked() && levelFor(t) <= 0));
    }).length;
    el("foot-left").textContent = pouring + (pouring === 1 ? " beer pouring" : " beers pouring");

    var hb = el("happybar");
    if(hb){
      var pr2 = pricing(), on2 = pr2.on && happyActive();
      hb.className = on2 ? "on" : "";
      if(on2){
        var lbl = (pr2.happy && pr2.happy.label) || "Happy Hour";
        var til = prettyTime(pr2.happy && pr2.happy.to);
        hb.textContent = lbl + (til ? " \u2014 until " + til : "");
      }
    }

    pageIndex = 0;
    startRotate(Math.max(6, Number(data.rotateSeconds) || 20));
    fitToCards(scale, false);
  }

  /* ---------- make sure nothing is ever clipped ----------
     Card height is fixed by the grid, but what goes in a card is not: a long name
     wraps, prices add a line, a note runs on. Rather than guess a scale that suits
     the content we happen to have today, shrink until it genuinely fits.

     One scale is applied to EVERY page, not per page, so a beer is never a
     different size on one screen than another. */
  function fitToCards(startScale, allowGrow){
    var STEP = 0.035, FLOOR = 0.5, CEIL = 1.9;
    function overflowing(){
      var t = main.querySelectorAll(".tap"), i;
      for(i = 0; i < t.length; i++){
        if(t[i].scrollHeight - t[i].clientHeight > 1) return true;
      }
      return false;
    }
    function run(){
      var pages = main.querySelectorAll(".page"), guard = 0;
      var s = Number(startScale) || 1;
      function apply(v){
        for(var i = 0; i < pages.length; i++) pages[i].style.setProperty("--s", v.toFixed(3));
      }
      /* Start clean — this may be a re-run after the fonts arrived. */
      var cards = main.querySelectorAll(".tap"), i;
      for(i = 0; i < cards.length; i++) cards[i].style.removeProperty("--s");
      apply(s);

      /* Climb while EVERY card still fits, then take back the overshoot. */
      if(allowGrow){
        while(guard++ < 30 && s < CEIL && !overflowing()){ s += STEP; apply(s); }
        if(overflowing()){ s -= STEP; apply(s); }
      }

      /* Anything still too tall is shrunk on its own, rather than dragging the
         whole board down with it. One beer with a very long name used to cost
         every other card a quarter of its size. If the size is systematically
         wrong then every card shrinks anyway, which is the old behaviour. */
      for(i = 0; i < cards.length; i++){
        var c = cards[i], cs = s, g2 = 0;
        while(g2++ < 40 && cs > FLOOR && c.scrollHeight - c.clientHeight > 1){
          cs -= STEP;
          c.style.setProperty("--s", cs.toFixed(3));
        }
      }
    }
    /* Web fonts change every measurement, so wait for them where the browser
       supports it, and measure again on the next frame regardless. */
    if(document.fonts && document.fonts.ready && document.fonts.ready.then){
      document.fonts.ready.then(function(){ setTimeout(run, 0); });
    }
    setTimeout(run, 60);
  }

  function startRotate(seconds){
    if(rotateTimer) clearInterval(rotateTimer);
    if(pages.length < 2) return;
    rotateTimer = setInterval(function(){
      var ps = document.querySelectorAll(".page"), ds = document.querySelectorAll(".dot");
      if(!ps.length) return;
      if(ps[pageIndex]) ps[pageIndex].classList.remove("on");
      if(ds[pageIndex]) ds[pageIndex].classList.remove("on");
      pageIndex = (pageIndex + 1) % ps.length;
      if(ps[pageIndex]) ps[pageIndex].classList.add("on");
      if(ds[pageIndex]) ds[pageIndex].classList.add("on");
    }, seconds * 1000);
  }

  /* ---------- background photo ----------
     Kept out of taps.json so the every-60s poll stays a couple of KB.
     Re-fetched only when bgV changes. */
  var bgPhotoData = null, bgPhotoV = null, bgPhotoPending = false;

  function paintBgPhoto(){
    if(bgPhotoData){
      document.body.style.backgroundImage =
        "linear-gradient(rgba(14,12,10,.74),rgba(14,12,10,.80)), url('" + bgPhotoData + "')";
    }
  }

  function applyBgPhoto(bg){
    if(bg !== "photo"){
      document.body.style.backgroundImage = "";
      return;
    }
    var want = String(data.bgV || "");
    if(bgPhotoData && bgPhotoV === want){ paintBgPhoto(); return; }
    if(bgPhotoPending) return;
    bgPhotoPending = true;

    var x = new XMLHttpRequest();
    x.open("GET", DATA_BASE + "bgphoto.json?v=" + encodeURIComponent(want), true);
    x.timeout = 20000;
    x.onload = function(){
      bgPhotoPending = false;
      if(x.status >= 200 && x.status < 300){
        try {
          var j = JSON.parse(x.responseText);
          if(j && j.photo){ bgPhotoData = j.photo; bgPhotoV = want; paintBgPhoto(); }
        } catch(e){}
      }
    };
    x.onerror = x.ontimeout = function(){ bgPhotoPending = false; };
    x.send();
  }

  /* ---------- keg level sensors ----------
     Anything that can make an HTTP request can report a level; the Worker turns
     litres or kilograms into a percentage. The board simply prefers a fresh reading
     over the slider, and falls back to the slider the moment one goes quiet — so a
     flat battery leaves the board working exactly as it did before. */
  var WORKER_BASE = "https://ontap-publish.madlad-taps.workers.dev";
  var SENSOR      = {};

  /* Keg levels are off until someone connects something that actually measures one.
     The slider was never kept up to date — every tap sat on a round number — so a
     board showing "half full" was decorating a guess. With nothing connected the
     glasses simply draw full and nothing claims to know what is left. */
  function sensorCfg(){
    var c = (data && data.sensors) || {};
    return {
      on: !!c.on,
      url: String(c.url || "").trim() || (WORKER_BASE + "/levels"),
      staleMs: (Number(c.staleHours) > 0 ? Number(c.staleHours) : 6) * 3600 * 1000
    };
  }
  function levelsTracked(){ return sensorCfg().on; }

  function levelFor(t){
    if(!levelsTracked()) return 100;      /* not measuring — draw it full, claim nothing */
    var s = SENSOR[String(t.num)];
    if(s && isFinite(s.pct) && (Date.now() - s.at) < sensorCfg().staleMs) return s.pct;
    return Number(t.level) || 0;          /* connected, but this tap isn't reporting */
  }

  var pollLevels = null;
  (function(){
    var last = "";
    function poll(){
      /* Nothing connected means nothing to ask. This also keeps the board from
         calling an endpoint that may not exist and logging an error every minute. */
      if(!levelsTracked()) return;
      var x = new XMLHttpRequest();
      x.open("GET", sensorCfg().url + "?t=" + Date.now(), true);
      x.timeout = 8000;
      x.onload = function(){
        if(x.status < 200 || x.status >= 300) return;
        var j; try { j = JSON.parse(x.responseText); } catch(e){ return; }
        if(!j || !j.taps) return;
        var stamp = JSON.stringify(j.taps);
        if(stamp === last) return;
        last = stamp; SENSOR = j.taps;
        if(data) render();               /* a level moved — redraw the glasses */
      };
      x.onerror = x.ontimeout = function(){};
      x.send();
    }
    pollLevels = poll;
    poll();
    setInterval(poll, 60000);
  })();

  /* ---------- load + refresh ----------
     ?demo=business reads a separate file, so the business version can be looked at
     on a real screen without touching the board this site actually runs. Only that
     one name is accepted — the parameter picks from a list, it is not a path. */
  /* Where the beer list lives, relative to this page. The staging copy under /next/
     sets this to "../" so it reads the LIVE list — new code, real beers. stage.sh
     and promote.sh flip this one line; nothing else about the file changes.
     build.txt is deliberately NOT prefixed, so each deployment self-updates against
     its own stamp rather than fighting the other one. */
  var DATA_BASE = "../";
  var STAGING   = true;

  var DEMOS = { business: "business-taps.json" };
  function dataFile(){
    var m = /[?&]demo=([a-z]+)/i.exec(location.search || "");
    return DATA_BASE + ((m && DEMOS[m[1].toLowerCase()]) || "taps.json");
  }

  /* ?preview=1 renders the editor's UNPUBLISHED draft instead of the live file, so a
     change can be seen on the real board before anyone else sees it. The editor and
     the board are the same origin, so its draft is simply readable from here. */
  var PREVIEW   = /[?&]preview=1/.test(location.search || "");
  var DRAFT_KEY = "tapdraft.v1";
  function draftData(){
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if(!raw) return null;
      var d = JSON.parse(raw);
      return (d && d.data) ? d.data : null;
    } catch(e){ return null; }
  }

  /* Neither a demo nor a preview may poison the cache the real board falls back to. */
  var CACHE_KEY = "tapcache.v1" +
    (PREVIEW ? ".preview" : (dataFile() === DATA_BASE + "taps.json" ? "" : ".demo"));

  function load(){
    var url = dataFile() + "?t=" + Date.now();
    var done = false;

    function apply(json){
      if(done) return; done = true;
      var stamp = JSON.stringify(json);
      /* Keep the last good list so a boot before the wifi is up still shows beers. */
      try { localStorage.setItem(CACHE_KEY, stamp); } catch(e){}
      if(stamp === lastStamp) return;      /* unchanged - don't restart the rotation */
      lastStamp = stamp; data = json; render();
      if(pollLevels) pollLevels();
    }
    function fail(){
      if(done) return; done = true;
      if(data) return;                     /* already showing something - leave it */
      var cached = null;
      try { cached = localStorage.getItem(CACHE_KEY); } catch(e){}
      if(cached){
        try { data = JSON.parse(cached); lastStamp = cached; render(); return; } catch(e){}
      }
      data = FALLBACK; render();
    }

    /* A draft beats the network entirely. If there is no draft the published list is
       fetched as usual, so the preview still shows the board rather than nothing. */
    if(PREVIEW){
      var draft = draftData();
      if(draft){ apply(draft); return; }
    }

    try {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.timeout = 12000;
      xhr.onload = function(){
        if(xhr.status >= 200 && xhr.status < 300){
          try { apply(JSON.parse(xhr.responseText)); } catch(e){ fail(); }
        } else fail();
      };
      xhr.onerror = xhr.ontimeout = fail;
      xhr.send();
    } catch(e){ fail(); }
  }

  load();
  setInterval(load, 60000);

  /* Prices change on the clock, but render() only runs when the data changes — so
     watch for the window opening or closing and redraw on the transition. */
  (function(){
    var was = null;
    setInterval(function(){
      if(!data) return;
      var now = pricing().on && happyActive();
      if(was === null){ was = now; return; }
      if(now !== was){ was = now; render(); }
    }, 20000);
  })();

  /* In preview, follow the editor live. The storage event fires in OTHER tabs, which
     is exactly the case here — edit in one tab, watch it change in this one. The slow
     poll is a safety net for browsers that hold the event back. */
  function paintBadge(){
    var pb = el("previewbadge");
    if(!pb) return;
    /* Once the draft is published there is nothing left to preview, and the page is
       showing exactly what everyone else sees — so the badge goes. Without this it
       lingered on a tab left open and looked like the board had got stuck. */
    var showing = STAGING || (PREVIEW && draftData());
    pb.textContent = STAGING ? "Staging — not the live board" : "Preview — not published";
    pb.style.display = showing ? "block" : "none";
  }
  paintBadge();
  if(PREVIEW){
    window.addEventListener("storage", function(e){
      if(!e || e.key === DRAFT_KEY){ load(); paintBadge(); }
    }, false);
    setInterval(function(){ load(); paintBadge(); }, 2000);
  }

  /* ---------- pick up new versions of this page by itself ----------
     BUILD is baked into whatever page is actually running. build.txt on the
     server says what the current build is. If they differ, this page is stale
     and reloads. Unlike comparing ETags, this cannot be fooled by a cached
     page, because BUILD travels with the page itself. */
  var BUILD = "20260729-213913";

  (function(){
    function check(){
      var x = new XMLHttpRequest();
      x.open("GET", "build.txt?v=" + Date.now(), true);
      x.timeout = 10000;
      x.onload = function(){
        if(x.status < 200 || x.status >= 300) return;
        var latest = (x.responseText || "").trim();
        if(latest && latest !== BUILD){ location.reload(); }
      };
      x.onerror = x.ontimeout = function(){};
      x.send();
    }
    check();
    setInterval(check, 60000);
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) check();
    }, false);
  })();

  /* ---------- the immature bit ----------
     Fired from the laptop. The Worker hands out a counter alongside the
     timestamp, so every screen runs the same gag and each press moves on
     to the next one. */
  (function(){
    var wrap = el("rain");
    if(!wrap) return;

    var SIGNAL_URL = "https://ontap-publish.madlad-taps.workers.dev/laugh";
    var POLL_MS = 3000;
    var lastSeen = null, running = false;

    function done(ms){ setTimeout(function(){ running = false; }, ms); }

    /* 1 - the doodle shower */
    function gagDoodles(){
      wrap.innerHTML = ""; wrap.className = "on";
      var doodle = window.DOODLE || "", i, d;
      for(i = 0; i < 60; i++){
        d = document.createElement("div");
        d.className = "drop";
        d.style.left = (Math.random() * 97) + "vw";
        d.style.width = (26 + Math.random() * 44) + "px";
        d.style.animationDuration = (2.4 + Math.random() * 3.0) + "s";
        d.style.animationDelay = (Math.random() * 6.5) + "s";
        d.style.setProperty("--spin", (Math.random() * 1440 - 720).toFixed(0) + "deg");
        d.innerHTML = doodle;
        wrap.appendChild(d);
      }
      setTimeout(function(){ wrap.className = ""; wrap.innerHTML = ""; }, 10000);
      done(10500);
    }

    /* 6 - somebody's browsing history, briefly */
    var HIST = [
      ["9:38 pm", "how to tell if a keg has gone off", "google.com"],
      ["9:44 pm", "is it normal to name your kegerator", "reddit.com"],
      [null, "pornhub.com"],
      [null, "pornhub.com"],
      ["9:58 pm", "can my wife see what i search on the wifi", "google.com"],
      [null, "pornhub.com"],
      ["10:04 pm", "does incognito actually work", "google.com"],
      [null, "pornhub.com"],
      ["10:12 pm", "clear router history telstra", "whirlpool.net.au"],
      [null, "pornhub.com"],
      ["10:31 pm", "how to delete browsing history", "google.com"]
    ];
    var REDT = ["9:51 pm", "9:53 pm", "10:01 pm", "10:07 pm", "10:19 pm"];
    function gagHistory(){
      var box = el("histgag");
      if(!box){ done(400); return; }
      var day = new Date();
      el("histday").textContent = "Today \u2014 " +
        day.toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long", year:"numeric"});
      var r = 0;
      el("histrows").innerHTML = HIST.map(function(h){
        if(h[0] === null){
          /* title reads like the other rows, no censor bars */
          var t = REDT[r++] || "9:59 pm";
          return '<div class="hrow"><span class="htime">' + t + '</span><span class="hfav"></span>' +
                 '<span class="htitle">Pornhub.com</span>' +
                 '<span class="hsite">' + esc(h[1]) + '</span></div>';
        }
        return '<div class="hrow"><span class="htime">' + esc(h[0]) + '</span><span class="hfav"></span>' +
               '<span class="htitle">' + esc(h[1]) + '</span>' +
               '<span class="hsite">' + esc(h[2]) + '</span></div>';
      }).join("");
      box.className = "on";
      /* Long enough for a room to notice, read it, and start pointing. */
      setTimeout(function(){ box.className = ""; }, 15000);
      done(15600);
    }

    /* 3 - netflix asks the room a fair question */
    function gagStill(){
      var box = el("stillgag");
      if(!box){ done(400); return; }

      /* Name a beer that is actually pouring, the way Netflix names the show.
         Falls back through: live taps -> any named tap -> nothing at all. */
      var taps = (data && data.taps) || [], live = [], i, t, label = "";
      for(i = 0; i < taps.length; i++){
        t = taps[i];
        if(!t || String(t.name || "").trim() === "") continue;
        if(t.status === "kicked" || t.status === "coming") continue;
        if((Number(t.level) || 0) <= 0 && t.status !== "on") continue;
        live.push(t);
      }
      if(!live.length){
        for(i = 0; i < taps.length; i++){
          t = taps[i];
          if(t && String(t.name || "").trim() !== "") live.push(t);
        }
      }
      if(live.length){
        t = live[Math.floor(Math.random() * live.length)];
        label = String(t.name || "").trim();
        if(t.num) label += " · Tap " + t.num;
      }
      el("stillsub").textContent = label;

      var n = 5;
      el("stillcount").textContent = "Resuming in " + n;
      box.className = "on";

      var tick = setInterval(function(){
        n--;
        el("stillcount").textContent = n > 0 ? "Resuming in " + n : "";
        if(n <= 0) clearInterval(tick);
      }, 1000);

      setTimeout(function(){
        clearInterval(tick);
        box.className = "";
        el("stillcount").textContent = "";
      }, 6000);
      done(6600);
    }

    var GAGS = [gagDoodles, gagHistory, gagStill];

    function runGag(n){
      if(running || !data) return;
      running = true;
      var idx = ((Number(n) || 0) % GAGS.length + GAGS.length) % GAGS.length;
      try { GAGS[idx](); } catch(e){ running = false; }
    }

    function poll(){
      var x = new XMLHttpRequest();
      x.open("GET", SIGNAL_URL + "?t=" + Date.now() +
             "&build=" + encodeURIComponent(BUILD) + "&gags=" + GAGS.length, true);
      x.timeout = 8000;
      x.onload = function(){
        if(x.status < 200 || x.status >= 300) return;
        var j = null;
        try { j = JSON.parse(x.responseText); } catch(e){ return; }
        if(!j) return;
        if(lastSeen === null){ lastSeen = j.t; return; }   /* first read just syncs */
        if(j.t && j.t !== lastSeen){ lastSeen = j.t; runGag(j.n); }
      };
      x.onerror = x.ontimeout = function(){};
      x.send();
    }

    poll();
    setInterval(poll, POLL_MS);
  })();

  /* ---------- keep the screen awake ----------
     Two independent mechanisms, because Fire TV sleeps at the OS level and
     neither approach is guaranteed on every Fire OS build:
       1. the standard Screen Wake Lock API
       2. a silent looping video, which Android treats as active playback     */
  var wakeLock = null;

  function requestWakeLock(){
    if(!navigator.wakeLock || !navigator.wakeLock.request) return;
    try {
      navigator.wakeLock.request("screen").then(function(lock){
        wakeLock = lock;
        lock.addEventListener("release", function(){ wakeLock = null; });
      })["catch"](function(){ /* not permitted - the video fallback covers it */ });
    } catch(e){}
  }

  function nudgeVideo(){
    var v = el("awake");
    if(!v) return;
    try {
      var pr = v.play();
      if(pr && pr["catch"]) pr["catch"](function(){});   /* needs a gesture - retried on OK */
    } catch(e){}
  }

  function keepAwake(){ requestWakeLock(); nudgeVideo(); }

  keepAwake();
  /* Re-arm: locks are dropped whenever the page is backgrounded, and some
     builds quietly stop the video. Cheap to check. */
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) keepAwake();
  }, false);
  var av = el("awake");
  if(av){
    av.addEventListener("pause", nudgeVideo, false);
    av.addEventListener("ended", nudgeVideo, false);
  }
  setInterval(function(){
    if(!wakeLock) requestWakeLock();
    if(av && av.paused) nudgeVideo();
  }, 30000);

  /* ---------- full screen ----------
     Inside the Fire TV app we're already fullscreen with no address bar,
     so the prompt and the fullscreen request are both pointless there. */
  var inApp = /[?&]app=1\b/.test(location.search);
  var hint = el("fshint"), hintTimer = null;
  if(inApp && hint){ hint.parentNode.removeChild(hint); hint = null; }

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.webkitIsFullScreen || document.mozFullScreenElement);
  }
  function hideHint(){
    if(!hint) return;
    hint.className = "gone";
    if(hintTimer){ clearTimeout(hintTimer); hintTimer = null; }
  }
  function goFullscreen(){
    var d = document.documentElement;
    var fn = d.requestFullscreen || d.webkitRequestFullscreen ||
             d.webkitRequestFullScreen || d.mozRequestFullScreen || d.msRequestFullscreen;
    if(!inApp && fn){ try { fn.call(d); } catch(e){} }
    hideHint();
    keepAwake();          /* the OK press is the user gesture autoplay may need */
  }

  document.addEventListener("click", goFullscreen, false);
  document.addEventListener("keydown", function(e){
    var k = e.keyCode;
    if(k === 13 || k === 32 || k === 179 || k === 85) goFullscreen();
  }, false);
  ["fullscreenchange","webkitfullscreenchange","mozfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){ if(isFullscreen()) hideHint(); }, false);
  });
  if(hint){
    if(isFullscreen()) hideHint();
    else hintTimer = setTimeout(hideHint, 30000);
  }
})();
</script>
</body>
</html>
