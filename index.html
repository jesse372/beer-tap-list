<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On Tap</title>
<meta name="theme-color" content="#12100e">
<link rel="icon" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="On Tap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#12100e;
    --panel:#1c1815;
    --line:rgba(226,197,140,.16);
    --cream:#f4e9d5;
    --muted:#a99c85;
    --gold:#e0a63a;
    --s:1;                 /* global scale, set by JS from row count */
    --pad:3.2vh;           /* TV overscan safety */
  }
  html,body{height:100%}
  body{
    background:
      radial-gradient(120vh 90vh at 50% -20%, #2a231c 0%, transparent 62%),
      var(--bg);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    height:100vh;height:100dvh;
    padding:var(--pad) calc(var(--pad) * 1.5);
    display:flex;flex-direction:column;
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:2vw;padding-bottom:1.6vh;border-bottom:2px solid var(--line);
    flex:0 0 auto;
  }
  .brand{display:flex;align-items:center;gap:1.4vw;min-width:0}
  .mark{font-size:4.2vh;line-height:1;flex:0 0 auto}
  .mark img{display:block;height:8vh;max-width:26vw;object-fit:contain}
  .names{min-width:0}
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:4.4vh;line-height:1.05;font-weight:700;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tagline{font-size:1.85vh;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:.5vh}
  .right{text-align:right;flex:0 0 auto}
  .ontap{
    font-family:Georgia,serif;font-size:3.4vh;letter-spacing:.3em;
    color:var(--gold);text-transform:uppercase;
  }
  .clock{font-size:2vh;color:var(--muted);margin-top:.5vh;font-variant-numeric:tabular-nums}

  /* ---------- tap grid ---------- */
  main{flex:1 1 auto;min-height:0;position:relative;padding-top:1.8vh}
  .page{
    position:absolute;inset:1.8vh 0 0 0;
    display:grid;gap:1.6vh 2.2vw;
    opacity:0;transition:opacity .7s ease;pointer-events:none;
  }
  .page.on{opacity:1}

  .tap{
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    border:1px solid var(--line);border-radius:1.4vh;
    padding:calc(1.9vh * var(--s)) calc(2vh * var(--s));
    display:flex;gap:calc(1.8vh * var(--s));align-items:stretch;min-height:0;overflow:hidden;
  }
  .tap.kicked{opacity:.42}

  /* glass / level indicator */
  .glass{
    flex:0 0 auto;align-self:center;
    width:calc(5.6vh * var(--s));
    height:calc(14vh * var(--s));max-height:100%;
    border-radius:.7vh;
    background:rgba(255,255,255,.075);border:1px solid var(--line);
    position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  }
  .fill{width:100%;transition:height .6s ease;box-shadow:inset 0 .6vh 1.4vh rgba(255,255,255,.28)}
  .foam{height:.9vh;width:100%;background:linear-gradient(180deg,#fffaf0,#efe3cc);flex:0 0 auto}
  .num{
    position:absolute;inset:auto 0 0 0;text-align:center;
    font-size:calc(1.6vh * var(--s));font-weight:700;color:var(--cream);
    background:rgba(0,0,0,.55);padding:.35vh 0;letter-spacing:.06em;
  }

  .body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.5vh}
  .namerow{display:flex;align-items:center;gap:calc(1.2vh * var(--s));min-width:0}
  .ico{
    flex:0 0 auto;color:var(--gold);
    width:calc(4.2vh * var(--s));height:calc(4.2vh * var(--s));
  }
  .name{
    flex:1 1 auto;min-width:0;
    font-family:Georgia,"Times New Roman",serif;font-weight:700;
    font-size:calc(3.5vh * var(--s));line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .style{
    font-size:calc(1.95vh * var(--s));color:var(--gold);
    letter-spacing:.12em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .notes{
    font-size:calc(1.9vh * var(--s));color:var(--muted);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .stats{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:.9vh;text-align:right}
  .stat .v{font-size:calc(2.9vh * var(--s));font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .k{font-size:calc(1.35vh * var(--s));color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:.3vh}
  .badge{
    align-self:flex-end;font-size:calc(1.4vh * var(--s));letter-spacing:.18em;text-transform:uppercase;
    padding:.5vh 1vh;border-radius:.6vh;border:1px solid currentColor;white-space:nowrap;
  }
  .badge.low{color:#e8913c}
  .badge.kicked{color:#8d8578}
  .badge.coming{color:#7fb6a1}

  /* ---------- footer ---------- */
  footer{
    flex:0 0 auto;padding-top:1.4vh;border-top:2px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-size:1.6vh;color:var(--muted);letter-spacing:.1em;
  }
  .dots{display:flex;gap:.9vh}
  .dot{width:1vh;height:1vh;border-radius:50%;background:rgba(244,233,213,.25)}
  .dot.on{background:var(--gold)}

  .msg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:3vh;color:var(--muted);padding:6vh;line-height:1.5;
  }
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="brand">
      <div class="mark" id="mark">🍺</div>
      <div class="names">
        <h1 id="brewery">Loading…</h1>
        <div class="tagline" id="tagline"></div>
      </div>
    </div>
    <div class="right">
      <div class="ontap">On Tap</div>
      <div class="clock" id="clock"></div>
    </div>
  </header>

  <main id="main"></main>

  <footer>
    <div id="foot-left">&nbsp;</div>
    <div class="dots" id="dots"></div>
  </footer>
</div>

<script src="icons.js"></script>
<script>
(function(){
  "use strict";

  /* Fallback list so the TV NEVER shows a blank screen if taps.json can't load. */
  var FALLBACK = {
    brewery:"Home Brew", tagline:"", showClock:true, perPage:6, rotateSeconds:20,
    hideKicked:false,
    taps:[{num:1,name:"Tap list unavailable",style:"Check back shortly",abv:"",ibu:"",
           notes:"The tap list file could not be loaded.",color:"#e0a63a",level:0,status:"pouring"}]
  };

  var el = function(id){ return document.getElementById(id); };
  var data = null, pages = [], pageIndex = 0, rotateTimer = null, lastStamp = "";

  /* ---------- clock ---------- */
  function tickClock(){
    if(!data || data.showClock === false){ el("clock").textContent = ""; return; }
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "PM" : "AM";
    h = h % 12; if(h === 0) h = 12;
    el("clock").textContent = h + ":" + (m < 10 ? "0" + m : m) + " " + ap;
  }
  setInterval(tickClock, 15000);

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function chunk(arr, n){
    var out = [], i;
    for(i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out.length ? out : [[]];
  }

  function tapHTML(t){
    var level  = Math.max(0, Math.min(100, Number(t.level) || 0));
    var status = t.status || "pouring";
    var kicked = status === "kicked" || (status === "pouring" && level <= 0);
    var color  = t.color || "#e0a63a";

    var badge = "";
    if(status === "coming")      badge = '<div class="badge coming">Coming Soon</div>';
    else if(kicked)              badge = '<div class="badge kicked">Kicked</div>';
    else if(level <= 20)         badge = '<div class="badge low">Almost Gone</div>';

    var stats = "";
    if(t.abv) stats += '<div class="stat"><div class="v">' + esc(t.abv) + '%</div><div class="k">ABV</div></div>';
    if(t.ibu) stats += '<div class="stat"><div class="v">' + esc(t.ibu) + '</div><div class="k">IBU</div></div>';

    var shownLevel = (status === "coming") ? 0 : (kicked ? 0 : level);

    return '' +
      '<div class="tap' + (kicked || status === "coming" ? " kicked" : "") + '">' +
        '<div class="glass">' +
          (shownLevel > 4 ? '<div class="foam"></div>' : '') +
          '<div class="fill" style="height:' + shownLevel + '%;background:' + esc(color) + '"></div>' +
          '<div class="num">' + esc(t.num != null ? t.num : "") + '</div>' +
        '</div>' +
        '<div class="body">' +
          '<div class="namerow">' +
            (window.beerIconSVG ? window.beerIconSVG(t.icon, "ico") : "") +
            '<div class="name">' + esc(t.name || "Untitled") + '</div>' +
          '</div>' +
          (t.style ? '<div class="style">' + esc(t.style) + '</div>' : '') +
          (t.notes ? '<div class="notes">' + esc(t.notes) + '</div>' : '') +
        '</div>' +
        '<div class="stats">' + stats + badge + '</div>' +
      '</div>';
  }

  /* ---------- render ---------- */
  function render(){
    var main = el("main");

    /* Header logo: a picture if one was uploaded, otherwise the beer emoji. */
    var mark = el("mark");
    if(data.logo){
      var img = new Image();
      img.alt = "";
      img.onerror = function(){ mark.textContent = "🍺"; };   /* never leave a broken image on the TV */
      img.src = data.logo;
      mark.innerHTML = "";
      mark.appendChild(img);
    } else {
      mark.textContent = "🍺";
    }

    /* If the logo already spells out the name, don't print it twice. */
    var hideName = !!(data.logo && data.logoOnly);
    el("brewery").style.display = hideName ? "none" : "";
    el("brewery").textContent = data.brewery || "On Tap";
    el("tagline").textContent = data.tagline || "";
    tickClock();

    var taps = (data.taps || []).slice();
    if(data.hideKicked) {
      taps = taps.filter(function(t){
        return !(t.status === "kicked" || (t.status !== "coming" && (Number(t.level) || 0) <= 0));
      });
    }

    if(!taps.length){
      main.innerHTML = '<div class="msg">No beers on tap right now.<br>Check back soon! 🍺</div>';
      el("dots").innerHTML = "";
      el("foot-left").textContent = "";
      if(rotateTimer) clearInterval(rotateTimer);
      return;
    }

    var perPage = Math.max(1, Math.min(8, Number(data.perPage) || 6));
    pages = chunk(taps, perPage);

    /* Layout: one column for short lists, two columns once it gets busy. */
    var cols = perPage <= 3 ? 1 : 2;
    var rows = Math.ceil(perPage / cols);
    /* Scale text so a 2-row page reads big and a 4-row page still fits. */
    var scale = Math.max(0.62, Math.min(1.25, 3 / rows));

    main.innerHTML = pages.map(function(p, i){
      return '<div class="page' + (i === 0 ? " on" : "") + '" style="' +
        'grid-template-columns:repeat(' + cols + ',1fr);' +
        'grid-template-rows:repeat(' + rows + ',1fr);' +
        '--s:' + scale.toFixed(3) + '">' +
        p.map(tapHTML).join("") + '</div>';
    }).join("");

    el("dots").innerHTML = pages.length > 1
      ? pages.map(function(_, i){ return '<div class="dot' + (i === 0 ? " on" : "") + '"></div>'; }).join("")
      : "";

    el("foot-left").textContent = taps.length + (taps.length === 1 ? " beer" : " beers") + " on the board";

    pageIndex = 0;
    startRotate(Math.max(6, Number(data.rotateSeconds) || 20));
  }

  function startRotate(seconds){
    if(rotateTimer) clearInterval(rotateTimer);
    if(pages.length < 2) return;
    rotateTimer = setInterval(function(){
      var pagesEls = document.querySelectorAll(".page");
      var dotEls   = document.querySelectorAll(".dot");
      if(!pagesEls.length) return;
      if(pagesEls[pageIndex]) pagesEls[pageIndex].classList.remove("on");
      if(dotEls[pageIndex])   dotEls[pageIndex].classList.remove("on");
      pageIndex = (pageIndex + 1) % pagesEls.length;
      if(pagesEls[pageIndex]) pagesEls[pageIndex].classList.add("on");
      if(dotEls[pageIndex])   dotEls[pageIndex].classList.add("on");
    }, seconds * 1000);
  }

  /* ---------- load + auto-refresh ---------- */
  function load(){
    var url = "taps.json?t=" + Date.now();   /* cache-bust so the TV always sees fresh edits */
    var done = false;

    function apply(json){
      if(done) return; done = true;
      var stamp = JSON.stringify(json);
      if(stamp === lastStamp) return;        /* nothing changed - don't restart the rotation */
      lastStamp = stamp;
      data = json;
      render();
    }
    function fail(){
      if(done) return; done = true;
      if(!data){ data = FALLBACK; render(); }   /* only fall back if we've never loaded */
    }

    try {
      var xhr = new XMLHttpRequest();          /* XHR: works on every Fire TV browser build */
      xhr.open("GET", url, true);
      xhr.timeout = 12000;
      xhr.onload = function(){
        if(xhr.status >= 200 && xhr.status < 300){
          try { apply(JSON.parse(xhr.responseText)); } catch(e){ fail(); }
        } else { fail(); }
      };
      xhr.onerror = xhr.ontimeout = fail;
      xhr.send();
    } catch(e){ fail(); }
  }

  load();
  setInterval(load, 60000);                    /* pick up edits within a minute */

  /* Keep the screen busy so the TV is less likely to blank out. */
  setInterval(function(){ document.body.style.opacity = "0.999999"; setTimeout(function(){ document.body.style.opacity = ""; }, 60); }, 45000);
})();
</script>
</body>
</html>
